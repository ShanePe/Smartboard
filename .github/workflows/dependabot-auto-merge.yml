name: Dependabot auto-merge
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.event_name == 'check_suite' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge Dependabot pull request when allowed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then exit 0; fi
          AUTHOR="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')"
          if [ "$AUTHOR" != "dependabot[bot]" ]; then exit 0; fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash